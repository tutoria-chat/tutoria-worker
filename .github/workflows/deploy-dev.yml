name: Deploy DEV

# Where this deploys is deploy/dev.env: RAILWAY / AWS / AZURE = true|false.
# Third-party actions are pinned to a full commit SHA (the tag is in the comment).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: tutoria-worker-dev
  ECS_SERVICE: tutoria-worker-dev
  ECS_CLUSTER: tutoria-dev

jobs:
  targets:
    name: Where to deploy
    runs-on: ubuntu-latest
    outputs:
      railway: ${{ steps.read.outputs.railway }}
      aws: ${{ steps.read.outputs.aws }}
      azure: ${{ steps.read.outputs.azure }}
      tenant: ${{ steps.read.outputs.tenant }}
      subscription: ${{ steps.read.outputs.subscription }}
      client: ${{ steps.read.outputs.client }}
      registry: ${{ steps.read.outputs.registry }}
      rg: ${{ steps.read.outputs.rg }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read deploy/dev.env
        id: read
        run: |
          f=deploy/dev.env
          test -f "$f" || { echo "::error::$f is missing (is it git-ignored?)"; exit 1; }
          get() { sed -n "s/^$1=//p" "$f" | tail -n1 | tr -d '\r'; }
          for k in RAILWAY AWS AZURE; do v=$(get $k); case "$v" in true|false) ;; *) echo "::error::$k in $f must be true or false, is '$v'"; exit 1 ;; esac; done
          if [ "$(get AZURE)" = true ]; then
            for k in AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_ID AZURE_REGISTRY AZURE_RESOURCE_GROUP; do
              [ -n "$(get $k)" ] || { echo "::error::AZURE=true but $k is empty in $f"; exit 1; }
            done
          fi
          {
            echo "railway=$(get RAILWAY)"
            echo "aws=$(get AWS)"
            echo "azure=$(get AZURE)"
            echo "tenant=$(get AZURE_TENANT_ID)"
            echo "subscription=$(get AZURE_SUBSCRIPTION_ID)"
            echo "client=$(get AZURE_CLIENT_ID)"
            echo "registry=$(get AZURE_REGISTRY)"
            echo "rg=$(get AZURE_RESOURCE_GROUP)"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    # A throwaway Postgres for the stores and the job runner (tests/test_cloud_portability.py).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tutoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tutoria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/tutoria_test
        run: python -m pytest tests/ -q -p no:cacheprovider

  deploy-railway:
    name: Deploy to Railway DEV
    runs-on: ubuntu-latest
    needs: [test, targets]
    if: needs.targets.outputs.railway == 'true'
    environment:
      name: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
        run: |
          railway up --service tutoria-worker --environment development

      - name: Health Check
        run: |
          sleep 30
          curl -f "${{ secrets.RAILWAY_DEV_URL }}/health" || exit 1

  deploy-aws:
    name: Build & Deploy to ECS DEV
    runs-on: ubuntu-latest
    needs: [test, targets]
    if: needs.targets.outputs.aws == 'true'
    permissions:
      contents: read
      id-token: write # OIDC, once AWS_DEPLOY_ROLE_ARN exists
    environment:
      name: dev
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC role)
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-tutoria-worker-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys, until OIDC is set up)
        if: env.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name $ECR_REPOSITORY --image-scanning-configuration scanOnPush=true
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # The worker serves HTTP to the .NET API (WorkerApi:BaseUrl) and runs the
      # job consumers; config comes from SSM /tutoria/dev/worker/.
      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@7c48a2de16441d528a3c89829831968dc1455010 # v1.2.2
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.build-image.outputs.image }}
          execution-role-arn: ${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
          task-role-arn: ${{ secrets.ECS_TASK_ROLE_ARN }}
          container-port: 8001
          health-check-path: /health
          cpu: 512
          memory: 1024
          min-task-count: 1
          max-task-count: 1
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
          environment-variables: '[{"name":"ENVIRONMENT","value":"dev"},{"name":"AWS_SSM_PREFIX","value":"/tutoria/dev/worker/"},{"name":"AWS_REGION","value":"us-east-2"}]'

  deploy-azure:
    name: Build & Deploy to Azure DEV
    runs-on: ubuntu-latest
    needs: [test, targets]
    if: needs.targets.outputs.azure == 'true'
    concurrency:
      group: azure-dev-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC → the tutoria-github-dev identity's federated credential
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ needs.targets.outputs.client }}
          tenant-id: ${{ needs.targets.outputs.tenant }}
          subscription-id: ${{ needs.targets.outputs.subscription }}

      - name: Build, push and roll out
        env:
          APP: tutoria-worker-dev
          IMAGE_NAME: tutoria-worker
          RG: ${{ needs.targets.outputs.rg }}
          REGISTRY: ${{ needs.targets.outputs.registry }}
          PORT: "8001"
          HEALTH: "/health/ready"
        run: bash deploy/azure-deploy.sh
